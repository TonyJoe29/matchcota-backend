    <script>
        $(document).ready(function() {
            // Cuando se hace clic en cualquier botón con la clase 'btn-toggle'
            $('.btn-toggle').click(function(e) {
                e.preventDefault(); // Prevenir que el formulario se envíe si está dentro de uno
                
                // Buscar el contenedor padre (grupo de botones)
                var grupo = $(this).closest('.btn-group-toggle-custom');
                
                // Reiniciar todos los botones del grupo a su estado "inactivo"
                grupo.find('.btn-toggle')
                    .removeClass('bg-orange text-white border-hard') // Quitamos el color naranja
                    .addClass('bg-card text-soft-brown-color border-soft'); // Ponemos el color claro
                
                // Aplicar el estado "activo" (naranja) únicamente al botón que clickeamos
                $(this)
                    .removeClass('bg-card text-soft-brown-color border-soft')
                    .addClass('bg-orange text-white border-hard');
            });
        });
    </script>
