    <script>
        $(document).ready(function() {
            // Cuando se hace clic en cualquier botón con la clase 'btn-toggle'
            $('.btn-toggle').click(function(e) {
                e.preventDefault(); // Evitamos que haga un recargo de página accidental
                
                // Buscamos a qué grupo pertenece el botón que presionaste
                var grupo = $(this).closest('.btn-group-toggle-custom');
                
                // Le quitamos el color naranja a todos los botones de ESE grupo
                grupo.find('.btn-toggle')
                    .removeClass('bg-orange text-white border-hard')
                    .addClass('bg-card text-soft-brown-color border-soft');
                
                // Y le ponemos el color naranja solo al botón que presionaste
                $(this)
                    .removeClass('bg-card text-soft-brown-color border-soft')
                    .addClass('bg-orange text-white border-hard');
            });
        });
    </script>
